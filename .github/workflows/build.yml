name: Build Lynli

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set Go Proxy
        run: |
          go env -w GOPROXY=https://goproxy.cn,https://proxy.golang.org,direct
          go env -w GOSUMDB=off
          go env -w GOFLAGS=-mod=mod

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install -y ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          ls -la release.keystore

      - name: Create signing.properties
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf 'keystore.password=%s\nkey.alias=%s\nkey.password=%s\n' "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > signing.properties
          cat signing.properties

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          sed -i "s/versionName = \".*\"/versionName = \"$VERSION\"/" build.gradle.kts
          grep versionName build.gradle.kts

      - name: Build APK
        run: ./gradlew --no-daemon app:assembleAlphaRelease

      - name: List APKs
        run: ls -la app/build/outputs/apk/alpha/release/

      - name: Sign APK manually
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 找未签名的 APK
          UNSIGNED=$(ls app/build/outputs/apk/alpha/release/*.apk | grep -v Lynli.apk | head -1)
          echo "找到 APK: $UNSIGNED"

          # 找 apksigner
          APKSIGNER=$(find ${ANDROID_HOME}/build-tools -name apksigner 2>/dev/null | sort -r | head -1)
          echo "apksigner: $APKSIGNER"

          # 手动签
          $APKSIGNER sign \
            --ks release.keystore \
            --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out app/build/outputs/apk/alpha/release/Lynli.apk \
            "$UNSIGNED"

          # 验证签名
          $APKSIGNER verify --print-certs app/build/outputs/apk/alpha/release/Lynli.apk
          ls -la app/build/outputs/apk/alpha/release/Lynli.apk

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          repository: shuji-chu/Lynli-Release
          token: ${{ secrets.RELEASE_TOKEN }}
          files: app/build/outputs/apk/alpha/release/Lynli.apk
          tag_name: ${{ github.ref_name }}
          name: Lynli ${{ github.ref_name }}
          make_latest: true
