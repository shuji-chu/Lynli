name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter create --org com.ys --project-name ysapp --platforms android .
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
